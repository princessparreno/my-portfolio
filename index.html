<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Sweden Shane Parreno | DICT SPARK Portfolio</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            color: #fff;
            padding: 60px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0;
            color: #e94560;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        main {
            max-width: 1000px;
            margin: -30px auto 40px auto;
            padding: 0 20px;
        }

        section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 40px;
            margin-bottom: 30px;
        }

        h2 {
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .photo-card {
            background: #fafbfc;
            border: 1px solid #eaeaea;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .photo-card img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .photo-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 14px 0 0 0;
            font-style: italic;
        }

        .demos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .demo-card {
            background: #fafbfc;
            border: 1px solid #eaeaea;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .demo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .demo-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 14px 0 0 0;
            font-style: italic;
        }

        .chat-simulator {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            height: 320px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-align: left;
        }

        .chat-header {
            background: #0084ff;
            color: white;
            padding: 10px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-header span {
            width: 8px;
            height: 8px;
            background: #4cd964;
            border-radius: 50%;
            display: inline-block;
        }

        .chat-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .chat-bubble.user {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .chat-bubble.bot {
            background: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e1e4e8;
            background: #ffffff;
        }

        .map-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .animated-pin {
            position: absolute;
            top: 32%;
            left: 33.5%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bouncePin 1.5s infinite ease-in-out;
            pointer-events: none;
        }

        .pin-icon {
            width: 15px;
            height: 15px;
            background: #ea4335;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 0 6px rgba(234, 67, 53, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffffff;
        }

        .pin-icon::after {
            content: '';
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }

        .pin-glow {
            width: 10px;
            height: 3px;
            background: rgba(234, 67, 53, 0.35);
            border-radius: 50%;
            margin-top: 1px;
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        .qr-simulator {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            text-align: center;
            box-sizing: border-box;
        }

        .qr-img-container {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .qr-img-container:hover {
            transform: scale(1.03);
        }

        .qr-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-simulator h4 {
            margin: 4px 0 2px 0;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .qr-simulator p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: normal !important;
            line-height: 1.3;
        }

        .qr-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .qr-btn:hover {
            background: #1557b0;
        }

        @keyframes bouncePin {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-5px); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 0.2; }
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .team-card {
            background: #fafbfc;
            border: 1px solid #eaeaea;
            padding: 25px;
            border-radius: 8px;
            text-align: left;
            transition: box-shadow 0.2s ease;
        }

        .team-card:hover {
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .team-card h3 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 1.1rem;
        }
